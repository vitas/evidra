version: 2

project_name: evidra

before:
  hooks:
    - go mod tidy

builds:
  - id: evidra
    main: ./cmd/evidra
    binary: evidra
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/vitas/evidra/pkg/version.Version={{.Version}}
      - -X github.com/vitas/evidra/pkg/version.Commit={{.Commit}}
      - -X github.com/vitas/evidra/pkg/version.Date={{.Date}}

  - id: evidra-mcp
    main: ./cmd/evidra-mcp
    binary: evidra-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/vitas/evidra/pkg/version.Version={{.Version}}
      - -X github.com/vitas/evidra/pkg/version.Commit={{.Commit}}
      - -X github.com/vitas/evidra/pkg/version.Date={{.Date}}

archives:
  - id: evidra
    builds:
      - evidra
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "evidra_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: evidra-mcp
    builds:
      - evidra-mcp
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "evidra-mcp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
