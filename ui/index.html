        <h1>Evidra — MCP execution evidence</h1>
        <p>
          Evidra is an open-source execution-evidence recorder for the Model
          Context Protocol. One endpoint wraps one upstream MCP server and
          records what an agent declared, what the proxy observed, and what the
          agent reported, into a signed local evidence chain that a human
          reconciles afterwards.
        </p>
        <p>Local-first. Inspectable JSONL. No hosted service required.</p>
