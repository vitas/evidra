name: CI (vNext)

# Reduced supported build graph for the vNext experiment (§4 of
# docs/system-design/vnext-mcp-recorder.md).
#
# The hosted platform is not part of the product being tested on this branch, so
# it is neither built nor tested here. This workflow deliberately does not touch
# ci.yml, but ci.yml was trimmed to the same surface when §43 deleted what its extra gates
# tested: a "complete CI" that checks files which no longer exist blocks the merge path
# instead of protecting it. tests/vnext-workflows.txt lists every workflow and states which
# are live; tests/test_ci_workflows_resolve.sh fails if a live one references a deleted
# target, and refuses to let a disabled one rot into "silently broken but runnable".
#
# Nothing is excluded any more: the hosted platform and legacy product packages were deleted
# per §43, so every package in the module is vNext-supported. An empty exclusion regex would
# have been a trap - an empty pattern matches every line, which turns "test everything left"
# into "test nothing" while still reporting success. The package set is therefore declared in
# tests/vnext-packages.txt and compared against `go list ./...` in both directions rather than
# guarded by a count floor: the floor passed at 9 packages while one of them was a dead root
# package nothing imported, and it would have gone on passing as more left.
#
# The exclusion list is the supported-graph boundary. Nothing may be removed
# from the *supported* side to make this workflow green; if a core package
# breaks, that is a real failure.

on:
  push:
    branches: [vnext/mcp-recorder]
  pull_request:
    branches: [vnext/mcp-recorder]

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve supported package graph
        id: pkgs
        run: |
          # Checked in both directions, so CI cannot pass by testing a graph that quietly
          # shrank (or by testing one that grew without anyone declaring it).
          bash tests/test_supported_package_graph.sh
          cp tests/vnext-packages.txt "$GITHUB_WORKSPACE/.vnext-packages.txt"
          echo "count=$(grep -c . "$GITHUB_WORKSPACE/.vnext-packages.txt")"

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Vet
        run: go vet $(cat .vnext-packages.txt)

      - name: Build
        run: go build $(cat .vnext-packages.txt)

      - name: Test
        run: go test -count=1 $(cat .vnext-packages.txt)

      - name: Race detector on concurrency-sensitive packages
        run: |
          # Checked by tests/test_ci_workflows_resolve.sh: this list named
          # ./internal/lifecycle/... after the §43 prune deleted that package, and CI only
          # noticed by failing on a pushed branch. A workflow step pointing at a deleted path
          # is the same object as a checklist row pointing at a function that no longer
          # compiles - it proves nothing, it just looks like it does.
          go test -race -count=1 \
            ./pkg/evidence/... \
            ./pkg/proxy/... \
            ./pkg/report/... \
            ./cmd/evidra-fixture/... \
            ./cmd/evidra-gatea/...

      - name: Fixture determinism gate
        run: |
          # §30/§59 step 1 exit criterion: the fixture is deterministic and its
          # own conformance suite is green under the race detector.
          go test -count=1 -run 'TestResultsAreByteStable|TestSerial|TestConcurrent' ./cmd/evidra-fixture/
