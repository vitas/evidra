name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Run tests
        run: go test ./... -count=1

      - name: Run race detector
        run: go test -race ./... -count=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --timeout=5m
          verify: false

      - name: Install UI dependencies
        run: cd ui && npm ci

      - name: Run UI tests
        run: cd ui && npm test

      - name: Build UI
        run: cd ui && npm run build

      - name: Build binaries
        run: |
          go build -o bin/evidra ./cmd/evidra
          go build -o bin/evidra-mcp ./cmd/evidra-mcp

      - name: Run real-world e2e acceptance
        run: make e2e

      - name: Run contract integration suite
        run: make test-contracts

      # TODO: re-enable after fixing deferred tool schema tests
      # - name: Run inspector transport suite
      #   run: make test-mcp-inspector-ci

      - name: Run signal validation scenarios
        run: make test-signals

      - name: Check signal validation harness
        run: bash tests/test_signal_validation_harness.sh

      - name: Upload signal validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: signals-validation
          path: /tmp/evidra-signal-validation-results/**
          if-no-files-found: error

      - name: Verify generated prompts
        run: make prompts-verify

      - name: Check doc command paths
        run: bash scripts/check-doc-commands.sh

      - name: Check doc trust alignment
        run: bash tests/test_doc_trust_alignment.sh

      - name: Check supported surface positioning
        run: bash tests/test_supported_core_positioning.sh

      - name: Check legacy benchmark surface cleanup
        run: bash tests/test_no_legacy_benchmark_surface.sh

      - name: Check MCP mode label docs
        run: bash tests/test_mode_labels_docs.sh

      - name: Check test naming consistency
        run: bash tests/test_fixture_snapshot_names.sh

      - name: Check OSS dataset corpus
        run: bash tests/test_oss_dataset_corpus.sh

      - name: Check acceptance corpus promotion
        run: bash tests/test_acceptance_corpus_promotion.sh

      - name: Check unified artifact layout
        run: bash tests/test_unified_artifact_layout.sh
