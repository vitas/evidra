name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Run tests
        run: go test ./... -count=1

      - name: Run race detector
        run: go test -race ./... -count=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --timeout=5m
          verify: false

      - name: Install UI dependencies
        run: cd ui && npm ci

      - name: Run UI tests
        run: cd ui && npm test

      - name: Build UI
        run: cd ui && npm run build

      - name: Build binaries
        run: |
          go build -o bin/evidra ./cmd/evidra
          go build -o bin/evidra-mcp ./cmd/evidra-mcp

      - name: Run shell guards
        # Every tests/test_*.sh, no exclusion list. The steps this replaced called four
        # Make targets, five guards, a prompts/ directory and a signal-validation
        # artifact path that the §43 prune deleted - each one a gate that had stopped
        # gating long before anyone pushed to this branch.
        run: bash tests/run_guards.sh

