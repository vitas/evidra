version: "2"
linters:
  default: standard
  enable:
    - funlen
    - gocyclo
    - nestif
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Printf
    funlen:
      lines: 130
      statements: 80
      ignore-comments: true
    gocyclo:
      min-complexity: 24
    nestif:
      min-complexity: 8
  exclusions:
    # Third-party JavaScript dependencies may ship Go source of their own inside
    # node_modules (flatted has golang/pkg/flatted). That code is not this
    # module's to lint; the package-graph guard excludes it from the declared
    # set for the same reason.
    paths:
      - node_modules
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - nestif
