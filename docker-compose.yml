services:
  evidra-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./evidence:/evidence
    environment:
      - EVIDRA_EVIDENCE_DIR=/evidence
      - EVIDRA_ENVIRONMENT=development

# No database and no API service: the hosted storage path left the branch with §43.
# The recorder writes files under ./evidence and needs nothing else.
